name: Build Open Design Linux

# Builds an installable Linux AppImage from upstream nexu-io/open-design and
# publishes it on a rolling "linux-latest" release in this repository.
#
# Triggers:
#   - manual (optionally pinning an upstream tag/branch)
#   - daily schedule, which picks up the newest upstream release tag
#
# The build uses the upstream release-lane recipe:
#   tools-pack linux build --portable --to appimage --containerized
# plus --require-vela-cli so the bundled Vela CLI (needed for cloud login)
# is a hard build failure if missing, not a silent skip.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch (empty = latest upstream release tag)"
        required: false
        default: ""
  schedule:
    # Daily at 04:00 UTC — picks up new upstream releases within a day.
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-linux
  cancel-in-progress: true

env:
  UPSTREAM_REPO: nexu-io/open-design
  RELEASE_TAG: linux-latest
  NAMESPACE: linux

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.ref.outputs.version }}
      build: ${{ steps.ref.outputs.build }}
    steps:
      - name: Resolve upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "$UPSTREAM_REF" ]]; then
            ref="$UPSTREAM_REF"
          else
            ref="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          version="${ref#open-design-v}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          build=true
          if [[ "$EVENT_NAME" == schedule ]] && \
            release="$(gh release view "$RELEASE_TAG" --json name,body,assets 2>/dev/null)" && \
            jq -e --arg version "$version" --arg ref "$ref" --arg repo "$UPSTREAM_REPO" '
              .name == ("Open Design Linux " + $version) and
              (.body | contains("https://github.com/" + $repo + "/releases/tag/" + $ref)) and
              ([.assets[].name] | (index("VERSION") != null and
                index("Open-Design-linux-x64.AppImage") != null and
                index("open-design-icon.png") != null))
            ' <<< "$release" >/dev/null; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Upstream ref: $ref (version $version); build: $build"

  build:
    name: Build linux x64 AppImage
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout upstream source
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.ref }}
          fetch-depth: 1

      - name: Checkout CI repo (patches)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
          path: _ci

      # Upstream's assembled-app production install resolves transitive
      # @open-design/* deps from the npm registry (they are not published) and
      # blocks native build scripts. This patch makes tools-pack write a
      # pnpm-workspace.yaml into the assembled app pinning internal packages to
      # their packed tarballs and allowing native builds. Re-generate against a
      # new upstream tag with: patches/open-design-linux-pack.patch
      - name: Apply packaging patch
        run: |
          git apply --verbose _ci/patches/open-design-linux-pack.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Use a store inside the workspace: the containerized build resolves its
      # default pnpm store to /project/.pnpm-store, so a host install from the
      # same store keeps node_modules valid inside the container instead of
      # triggering the (TTY-blocked) node_modules purge prompt.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      # The inner `bash -lc` in the container sources this profile. CI=true
      # makes pnpm non-interactive if it ever needs to relink node_modules
      # (otherwise it aborts with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
      # npm_execpath points at the standalone pnpm binary so nested pnpm calls
      # from tools-pack skip `corepack`, which the electronuserland image strips.
      # /tmp on PATH lets electron-builder's node-module collector find `pnpm`
      # (the standalone binary lives at /tmp/pnpm).
      - name: Pre-seed container profile
        run: |
          mkdir -p "$RUNNER_TEMP/tools-pack/.docker-home"
          printf 'export CI=true\nexport PNPM_HOME=/tmp/pnpm-home\nexport npm_execpath=/tmp/pnpm\nexport PATH="/tmp:$PATH"\n' \
            > "$RUNNER_TEMP/tools-pack/.docker-home/.bash_profile"

      - name: Build AppImage
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec tools-pack linux build \
            --dir "$RUNNER_TEMP/tools-pack" \
            --namespace "$NAMESPACE" \
            --portable \
            --app-version "$VERSION" \
            --to appimage \
            --containerized \
            --require-vela-cli \
            --json 2>&1 | tee "$RUNNER_TEMP/tools-pack-build.log"

      # The upstream recipe packages the full electron-builder payload. Prune
      # what a linux x64 package never uses (extra UI locales, non-x64 native
      # blobs, source maps) before publishing: extract the AppImage, delete,
      # repack with appimagetool. This shrinks both the release download and
      # the /tmp extraction tree.
      - name: Trim AppImage payload
        run: |
          set -euo pipefail
          appimage="$(find "$RUNNER_TEMP/tools-pack" -type f -name '*.AppImage' | head -n 1)"
          [[ -n "$appimage" ]] || { echo "No AppImage produced" >&2; exit 1; }
          chmod +x "$appimage"
          if ! command -v mksquashfs >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq squashfs-tools
          fi
          rm -rf "$RUNNER_TEMP/trim"
          mkdir -p "$RUNNER_TEMP/trim"
          ( cd "$RUNNER_TEMP/trim" && "$appimage" --appimage-extract >/dev/null )
          tree="$RUNNER_TEMP/trim/squashfs-root"
          echo "Before trim: $(du -sh "$tree" | cut -f1)"
          # en-US.pak is Electron's fallback for every other UI language.
          find "$tree/locales" -type f ! -name 'en-US.pak' -delete
          # onnxruntime ships mac/win and arm64 builds; this package is x64-only.
          ort="$tree/resources/app/node_modules/onnxruntime-node/bin/napi-v3"
          if [[ -d "$ort" ]]; then
            find "$ort" -mindepth 2 -maxdepth 2 -type d ! -path '*/linux/x64' -exec rm -rf {} +
            find "$ort" -mindepth 1 -maxdepth 1 -type d -empty -delete
          fi
          find "$tree/resources/app/node_modules" -type f -name '*.map' -delete
          echo "After trim: $(du -sh "$tree" | cut -f1)"
          appimagetool="$RUNNER_TEMP/appimagetool.AppImage"
          curl -fsSL --retry 5 --retry-delay 2 -o "$appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$appimagetool"
          chmod -R a+rX "$tree"
          rm -f "$appimage"
          "$appimagetool" --appimage-extract-and-run --no-appstream "$tree" "$appimage"
          rm -rf "$RUNNER_TEMP/trim"
          ls -lh "$appimage"

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          appimage="$(find "$RUNNER_TEMP/tools-pack" -type f -name '*.AppImage' | head -n 1)"
          [[ -n "$appimage" ]] || { echo "No AppImage produced" >&2; exit 1; }
          mv "$appimage" "dist/Open-Design-linux-x64.AppImage"
          cp tools/pack/resources/linux/icon.png dist/open-design-icon.png
          chmod +x dist/Open-Design-linux-x64.AppImage
          # Tiny version marker so install.sh can compare installed vs latest
          # without downloading the AppImage first.
          printf '%s\n' "$VERSION" > dist/VERSION
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Design-linux-x64-${{ needs.check.outputs.version }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          # The checkout's git remote points at the upstream repo; pin gh to
          # this repository for release operations.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" dist/* \
            --title "Open Design Linux $VERSION" \
            --notes "Automated Linux (x64) build of [upstream $REF](https://github.com/${UPSTREAM_REPO}/releases/tag/${REF}).

          - AppImage: \`Open-Design-linux-x64.AppImage\` (install with \`install.sh\` from this repository)
          - Bundles the Vela CLI, so cloud login works out of the box.
          - Non-x64 runtime blobs, extra UI locales, and source maps are pruned to keep the download small.

          Install/update:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`"
